name: PEA Watch

on:
  schedule:
    - cron: "0 14 * * 1-5"   # 14h UTC = 15h (hiver) / 16h (été) à Paris, jours ouvrés
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  watch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pea_watch.py --out site/index.html
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PEA_POSITIONS: ${{ secrets.PEA_POSITIONS }}
          HIDE_AMOUNTS: "1"   # la page GitHub Pages est publique : pas de montants
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
